name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixtures:
    name: validate fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate handoff fixtures
        run: node scripts/validate-handoff.mjs

      - name: Validate interrupt fixtures
        run: node scripts/validate-interrupt.mjs

      - name: Validate all contracts
        run: node scripts/validate-all.mjs

  links:
    name: check relative links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check relative markdown links
        run: bash scripts/check-relative-links.sh
