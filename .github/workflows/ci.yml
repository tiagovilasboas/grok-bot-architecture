name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixtures:
    name: validate fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate handoff fixtures
        run: node scripts/validate-handoff.mjs

      - name: Validate interrupt fixtures
        run: node scripts/validate-interrupt.mjs

      - name: Validate all contracts
        run: node scripts/validate-all.mjs

  links:
    name: check relative links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check relative markdown links
        run: bash scripts/check-relative-links.sh
